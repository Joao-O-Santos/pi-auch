image: node:latest

stages:
  - test
  - publish
  - deploy

check:
  stage: test
  coverage: '/all files\s+\|\s+([0-9.]+)/'
  script:
    - npm ci
    - npm install --no-save @biomejs/biome@2.5.7
    - npm run check
    - npm pack --dry-run
    - npm audit --omit=dev

publish:
  stage: publish
  needs:
    - check
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - npm install --global npm@11.16.0
    - test "$CI_COMMIT_TAG" = "v$(node -p 'require("./package.json").version')"
    - npm publish --access public --provenance

pages:
  stage: deploy
  needs:
    - check
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - mkdir -p public
    - cp site/index.html public/index.html
    - cp logo.png public/logo.png
  pages: true
  artifacts:
    paths:
      - public
